      function rgb565(r, g, b) {
        return ((r & 248) << 8) | ((g & 252) << 3) | (b >> 3);
      }

      function color565(value) {
        const r = (value >> 11) & 31;
        const g = (value >> 5) & 63;
        const b = value & 31;
        return `rgb(${Math.round(r * 255 / 31)},${Math.round(g * 255 / 63)},${Math.round(b * 255 / 31)})`;
      }

      function color(r, g, b) { return color565(rgb565(r, g, b)); }

      function fillCircle(x, y, radius, fill) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
      }

      function fillRoundRect(x, y, width, height, radius, fill) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        ctx.fillStyle = fill;
        ctx.fill();
      }

      function drawSceneDots() {
        for (let i = 0; i < SCENE_COUNT; i++) {
          const x = WIDTH / 2 - (SCENE_COUNT - 1) * 6 + i * 12;
          fillCircle(x, 8, 2,
            i === scene ? color(255, 255, 255) : color(72, 72, 72));
        }
      }

      function drawHearts(elapsed) {
        ctx.fillStyle = color(8, 0, 12);
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        for (let i = 0; i < 12; i++) {
          const glow = (Math.sin(elapsed * 0.0013 + i * 2.1) + 1) * 0.5;
          const x = (i * 73 + 17) % WIDTH;
          const y = (i * 47 + 19) % HEIGHT;
          ctx.fillStyle = color(Math.trunc(30 + glow * 65),
            Math.trunc(10 + glow * 30), Math.trunc(30 + glow * 50));
          ctx.fillRect(x, y, 1, 1);
          if (glow > 0.75) {
            ctx.fillRect(x - 1, y, 3, 1);
            ctx.fillRect(x, y - 1, 1, 3);
          }
        }

        const baseX = [18, 52, 85, 117, 153, 185, 220, 253, 286, 311, 72, 205];
        const sizes = [5, 2, 6, 3, 7, 1, 4, 2, 5, 3, 0, 4];
        for (let i = 0; i < 12; i++) {
          const speed = 0.018 + sizes[i] * 0.003 + (i % 3) * 0.002;
          const travel = (elapsed * speed + i * 47) % (HEIGHT + 60);
          const y = HEIGHT + 22 - Math.trunc(travel);
          const x = baseX[i] + Math.trunc(Math.sin(elapsed * 0.0012 + i * 1.7) * (5 + i % 4));
          drawAssetFrame('floating-hearts', x - 22, y - 22, sizes[i] + (i % 4) * 8);
        }
      }

      function drawBigWord(word, x, y, cellW, cellH, letterSpacing, fill) {
        let cursorX = x;
        for (let index = 0; index < word.length; index++) {
          const letter = word[index];
          if (letter === ' ') {
            cursorX += cellW * 2;
            continue;
          }
          const rows = glyphs[letter] || glyphs.D;
          for (let col = 0; col < 5; col++) {
            const mask = 1 << (4 - col);
            let row = 0;
            while (row < 7) {
              while (row < 7 && !(rows[row] & mask)) row++;
              const firstRow = row;
              while (row < 7 && (rows[row] & mask)) row++;
              if (row > firstRow) {
                ctx.fillStyle = fill;
                ctx.fillRect(cursorX + col * cellW, y + firstRow * cellH,
                  cellW, (row - firstRow) * cellH);
              }
            }
          }
          cursorX += cellW * 5;
          if (word[index + 1] && word[index + 1] !== ' ') {
            cursorX += cellW + letterSpacing;
          }
        }
      }

      function bigWordWidth(word, cellW, letterSpacing) {
        let width = 0;
        for (let i = 0; i < word.length; i++) {
          if (word[i] === ' ') {
            width += cellW * 2;
          } else {
            width += cellW * 5;
            if (word[i + 1] && word[i + 1] !== ' ') width += cellW + letterSpacing;
          }
        }
        return width;

      const animationSheets = Object.fromEntries(Object.entries(animationAssets).map(([name, asset]) => {

      function drawAssetFrame(name, x, y, index) {
        const asset = animationAssets[name];
        const sheet = animationSheets[name];
        if (!sheet.complete || !sheet.naturalWidth) return;
        ctx.drawImage(sheet, (index % asset.columns) * asset.width,
          Math.floor(index / asset.columns) * asset.height, asset.width, asset.height,
          Math.trunc(x), Math.trunc(y), asset.width, asset.height);
      }

      function drawAnimationFrame(name, x, y, elapsed, period) {
        drawAssetFrame(name, x, y,
          Math.floor((elapsed % period) * animationAssets[name].frames / period));
      }

      function drawLoveMessage(elapsed) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        const cellW = 9;
        const cellH = 9;
        const letterSpacing = 2;
        const lineHeight = 7 * cellH;
        const lineGap = 8;
        const top = Math.trunc((HEIGHT - lineHeight * 2 - lineGap) / 2);
        const bottomLine = 'MY BF';
        const heartGap = 12;
        const heart = animationAssets['heart-beat'];
        const bottomWidth = bigWordWidth(bottomLine, cellW, letterSpacing) + heartGap + heart.width;
        const bottomX = Math.trunc((WIDTH - bottomWidth) / 2);
        const bottomY = top + lineHeight + lineGap;

        ctx.fillStyle = color(255, 255, 255);
        drawBigWord('I LOVE', Math.trunc((WIDTH - bigWordWidth('I LOVE', cellW, letterSpacing)) / 2),
          top, cellW, cellH, letterSpacing, color(255, 255, 255));
        drawBigWord(bottomLine, bottomX, bottomY, cellW, cellH,
          letterSpacing, color(255, 255, 255));
        drawAnimationFrame('heart-beat',
          bottomX + bigWordWidth(bottomLine, cellW, letterSpacing) + heartGap,
          bottomY + Math.trunc((lineHeight - heart.height) / 2), elapsed, 900);
      }

      function equalizerLevel(time, bar) {
        const swell = (Math.sin(time * 0.0037 + bar * 0.63) + 1) * 0.5;
        const detail = (Math.sin(time * 0.0089 - bar * 1.31) + 1) * 0.5;
        const envelope = (Math.sin(time * 0.0013 - bar * 0.21) + 1) * 0.5;
        return 2 + 5 * (0.50 * swell + 0.28 * detail + 0.22 * envelope);
      }

      function drawEqualizer(elapsed) {
        const reds = [20,20,20,30,40,60,85,115,145,175,205,230,250,255,255,255];
        const greens = [235,225,210,190,165,140,115,90,70,55,45,40,45,60,80,105];
        const blues = [190,210,235,255,255,255,255,255,255,255,250,230,210,185,155,135];
        const baseline = 158;
        ctx.fillStyle = color(3, 4, 10);
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        for (let i = 0; i < 16; i++) {
          const x = 1 + i * 20;
          const level = equalizerLevel(elapsed, i);
          let peak = level;
          for (let age = 50; age <= 500 && age <= elapsed; age += 50) {
            peak = Math.max(peak, equalizerLevel(elapsed - age, i) - age * 0.003);
          }
          for (let segment = 0; segment < 7; segment++) {
            const active = segment < Math.trunc(level);
            const y = baseline - (segment + 1) * 20;
            const gain = active ? 0.85 : 0.055;
            ctx.fillStyle = color(reds[i]*gain, greens[i]*gain, blues[i]*gain);
            ctx.fillRect(x, y, 18, 18);
            if (active) {
              ctx.fillStyle = color(reds[i]/2, greens[i]/2, blues[i]/2);
              ctx.fillRect(x, y+16, 18, 2);
            }
          }
          ctx.fillStyle = color((reds[i]+255)/2, (greens[i]+255)/2, (blues[i]+255)/2);
          ctx.fillRect(x, baseline - Math.trunc(peak)*20 - 6, 18, 4);
          ctx.fillStyle = color(reds[i]/4, greens[i]/4, blues[i]/4);
          for (let tile = 0; tile < 2; tile++) {
            ctx.fillRect(x + tile*12, baseline+4, 6, 4);
          }
        }
      }

      function drawWalkingCat(elapsed) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        const cat = animationAssets['cat-walk'];
        const cycle = WIDTH + cat.width - 8;
        const travel = Math.floor(elapsed * 4 / 65) % cycle;
        drawAnimationFrame('cat-walk', WIDTH - 4 - travel,
          (HEIGHT - cat.height) / 2, elapsed, 1000);
      }

      function drawLoading(elapsed) {
        const head = Math.floor(elapsed / 100) % 8;
        ctx.fillStyle = color(3, 5, 12);
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (let i = 0; i < loadingPositions.length; i++) {
          const age = (head + 8 - i) % 8;
          const level = loadingFade[age];
          ctx.fillStyle = color(level, level, level);
          ctx.fillRect(loadingPositions[i][0], loadingPositions[i][1], 20, 20);
        }
      }

      function drawMovingText(elapsed, hungry) {
        const background = hungry ? color(25, 5, 13) : color(3, 20, 24);
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const word = hungry ? 'HUNGRY' : 'FED';
        const mouth = hungry ? '(' : ')';
        const cellW = hungry ? 8 : 15;
        const cellH = hungry ? 23 : 22;
        const letterSpacing = hungry ? 2 : 0;
        const wordLength = hungry ? 6 : 3;
        const textWidth = wordLength * 5 * cellW
          + (wordLength - 1) * (cellW + letterSpacing);
        const textHeight = 7 * cellH;
        ctx.font = 'bold 128px Arial, sans-serif';
        const eyesWidth = Math.ceil(ctx.measureText(':').width);
        ctx.font = '128px Arial, sans-serif';
        const mouthWidth = Math.ceil(ctx.measureText(mouth).width);
        const emoticonWidth = eyesWidth + mouthWidth;
        const gap = 14;
        const itemWidth = textWidth + gap + emoticonWidth;
        const period = itemWidth + 14;
        const offset = Math.trunc(elapsed / 10) % period;
        const y = (HEIGHT - textHeight) / 2;
        const textColor = hungry ? color(255, 100, 83) : color(92, 255, 190);

        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        for (let x = -offset; x < WIDTH; x += period) {
          drawBigWord(word, x, y, cellW, cellH, letterSpacing, textColor);
          ctx.fillStyle = textColor;
          const emoticonX = x + textWidth + gap;
          ctx.font = 'bold 128px Arial, sans-serif';
          ctx.fillText(':', emoticonX, HEIGHT / 2);
          ctx.font = '128px Arial, sans-serif';
          ctx.fillText(mouth, emoticonX + eyesWidth, HEIGHT / 2);
        }
      }

      function setScene(nextScene) {
        scene = (nextScene + SCENE_COUNT) % SCENE_COUNT;
        sceneStarted = performance.now();
        pausedDuration = 0;
        if (paused) pausedAt = sceneStarted;
        modeName.textContent = sceneNames[scene];
        modeNumber.textContent = String(scene + 1).padStart(2, '0');
        sceneButtons.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.scene) === scene)));
      }

      function updatePlayback() {
        workbench.dataset.paused = String(paused);
        pauseButton.setAttribute('aria-pressed', String(paused));
        pauseButton.setAttribute('aria-label', paused ? 'Resume animation' : 'Pause animation');
        document.getElementById('pause-label').textContent = paused ? 'Resume' : 'Pause';
        document.getElementById('play-status').textContent = paused ? 'Paused' : 'Playing';
      }

      function togglePause() {
        const now = performance.now();
        if (paused) pausedDuration += now - pausedAt;
        else pausedAt = now;
        paused = !paused;
        updatePlayback();
      }

      function renderBrightness() {
        const percent = Math.round(brightness * 100 / BRIGHTNESS_MAX);
        canvas.style.filter = `brightness(${brightness / BRIGHTNESS_MAX})`;
        brightnessValue.textContent = `${percent}%`;
        brightnessLevel.style.width = `${percent}%`;
        brightnessSlider.value = brightness;
        brightnessSlider.setAttribute('aria-valuetext', `${percent}%`);
      }

      function adjustBrightness(direction) {
        showBrightnessIndicator = true;
        brightnessChangedAt = performance.now();
        const nextBrightness = Math.max(BRIGHTNESS_MIN,
          Math.min(BRIGHTNESS_MAX, brightness + direction * BRIGHTNESS_STEP));
        if (nextBrightness === brightness) return;
        brightness = nextBrightness;
        renderBrightness();
      }
      renderBrightness();

      function drawBrightnessIndicator(now) {
        if (!showBrightnessIndicator) return;
        if (now - brightnessChangedAt > 1200) {
          showBrightnessIndicator = false;
          return;
        }
        const y = HEIGHT - 4;
        fillRoundRect(0, y, WIDTH, 4, 2, color(45, 45, 50));
        fillRoundRect(0, y, brightness * WIDTH / BRIGHTNESS_MAX, 4, 2,
          color(235, 235, 245));
      }

      function createButtonAction(direction, sceneStep) {
        let holdTimer = 0;
        let repeatTimer = 0;
        let adjusted = false;
        let active = false;
        const buttons = [];

        function start() {
          if (active) return;
          active = true;
          buttons.forEach(button => button.dataset.pressed = 'true');
          adjusted = false;
          holdTimer = setTimeout(() => {
            if (!active) return;
            adjusted = true;
            adjustBrightness(direction);
            repeatTimer = setInterval(() => adjustBrightness(direction), BRIGHTNESS_REPEAT_MS);
          }, LONG_PRESS_MS);
        }

        function end(registerTap = true) {
          if (!active) return;
          active = false;
          buttons.forEach(button => delete button.dataset.pressed);
          clearTimeout(holdTimer);
          clearInterval(repeatTimer);
          if (!adjusted && registerTap) setScene(scene + sceneStep);
        }

        function bindButton(button) {
          buttons.push(button);
          button.addEventListener('pointerdown', event => {
            if (event.button !== 0) return;
            event.preventDefault();
            button.focus({ preventScroll: true });
            start();
            button.setPointerCapture(event.pointerId);
          });
          button.addEventListener('pointerup', () => end());
          button.addEventListener('pointercancel', () => end(false));
          button.addEventListener('lostpointercapture', () => end(false));
          button.addEventListener('keydown', event => {
            if (event.key === ' ' || event.key === 'Enter') {
              event.preventDefault();
              if (!event.repeat) start();
            }
          });
          button.addEventListener('keyup', event => {
            if (event.key === ' ' || event.key === 'Enter') {
              event.preventDefault();
              end();
            }
          });
          button.addEventListener('blur', () => end(false));
          button.addEventListener('click', event => {
            if (event.detail === 0) setScene(scene + sceneStep);
          });
        }

        return { start, end, bindButton };
      }

      const previousAction = createButtonAction(-1, -1);
      const nextAction = createButtonAction(1, 1);
      previousAction.bindButton(document.getElementById('prev'));
      nextAction.bindButton(document.getElementById('next'));
      function resetSimulator() {
        previousAction.end(false);
        nextAction.end(false);
        paused = false;
        brightness = BRIGHTNESS_MAX;
        showBrightnessIndicator = false;
        renderBrightness();
        updatePlayback();
        setScene(0);
      }

      document.getElementById('reset').addEventListener('click', resetSimulator);
      pauseButton.addEventListener('click', togglePause);
      sceneButtons.forEach(button => button.addEventListener('click', () => {
        previousAction.end(false);
        nextAction.end(false);
        setScene(Number(button.dataset.scene));
      }));
      brightnessSlider.addEventListener('input', () => {
        previousAction.end(false);
        nextAction.end(false);
        brightness = Math.max(BRIGHTNESS_MIN, Math.min(BRIGHTNESS_MAX, Number(brightnessSlider.value)));
        showBrightnessIndicator = true;
        brightnessChangedAt = performance.now();
        renderBrightness();
      });
      document.addEventListener('keydown', event => {
        if (event.ctrlKey || event.metaKey || event.altKey || event.target?.matches?.('input, textarea, select')) return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          if (!event.repeat) (event.key === 'ArrowLeft' ? previousAction : nextAction).start();
        }
        if (event.key.toLowerCase() === 'r' && !event.repeat) resetSimulator();
        if (event.key.toLowerCase() === 'p' && !event.repeat) {
          event.preventDefault();
          togglePause();
        }
        if (/^[1-7]$/.test(event.key) && !event.repeat) setScene(Number(event.key) - 1);
      });
      document.addEventListener('keyup', event => {
        if (event.key === 'ArrowLeft') previousAction.end();
        if (event.key === 'ArrowRight') nextAction.end();
      });
      window.addEventListener('blur', () => {
        previousAction.end(false);
        nextAction.end(false);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          previousAction.end(false);
          nextAction.end(false);
        }
      });

      setScene(0);
      updatePlayback();

      function render(now) {
        requestAnimationFrame(render);
        if (now - lastFrame < 35) return;
        lastFrame = now;
        const elapsed = (paused ? pausedAt : now) - sceneStarted - pausedDuration;
        if (scene === 0) drawHearts(elapsed);
        else if (scene === 1) drawMovingText(elapsed, true);
        else if (scene === 2) drawMovingText(elapsed, false);
        else if (scene === 3) drawLoveMessage(elapsed);
        else if (scene === 4) drawEqualizer(elapsed);
        else if (scene === 5) drawWalkingCat(elapsed);
        else if (scene === 6) {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          drawAnimationFrame('bad-apple', 0, 0, elapsed, animationAssets['bad-apple'].period);
        } else drawLoading(elapsed);
        drawBrightnessIndicator(now);
        if (now - sceneStarted < PAGE_INDICATOR_MS) drawSceneDots();
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
